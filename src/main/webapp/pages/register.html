<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
</head>
<body>
Back to login page <a href="login.html">here</a>
<p></p>
<h1>Register here!</h1>
<div class="container">
    <h2>Register</h2>
    <h4>Estes campos são obrigatórios!</h4>
    <form id="formRegistration">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required> <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required> <br><br>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required> <br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" name="phone" id="phone" required>  <br><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required> <br>
        <label for="passwordConfirmation">Password Confirmation:</label>
        <input type="password" name="passwordConfirmation" id="passwordConfirmation" required> <br>
        <button type="submit">Register</button>
    </form>
</div>
</body>
<script>
    const forms = document.getElementById("formRegistration");

    forms.addEventListener("submit", event => {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value.trim();
        const passwordConfirmation = document.getElementById("passwordConfirmation").value.trim();

        const data = {
            username,
            email,
            name,
            phone,
            password,
            passwordConfirmation
        };

        fetch('https://my-individual-project-418618.oa.r.appspot.com/rest/register/', {
            method: "POST",
            headers: {'Content-Type': 'application/json;'},
            body: JSON.stringify(data) // Stringify data object for request body
        }).then(response => {
            if (!response.ok) {
                throw new Error(`Registration failed with status ${response.status}`);
            } else {
                window.location.href = "../pages/login.html";
            }
        })
    });
</script>
</html>
