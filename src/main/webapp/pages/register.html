<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
</head>
<body>
Back to login page <a href="login.html">here</a>
<p></p>
<h1>Register here!</h1>
<div class="container">
    <h2>Register</h2>
    <h4>Estes campos são obrigatórios!</h4>
    <form id="formRegistration">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required> <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required> <br><br>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required> <br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" name="phone" id="phone" required>  <br><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required> <br>
        <label for="passwordConfirmation">Password Confirmation:</label>
        <input type="password" name="passwordConfirmation" id="passwordConfirmation" required> <br>
        <h4>Estes campos são opcionais!</h4>
        <label for="perfil">Perfil:</label>
        <select name="perfil" id="perfil">
            <option value="true">Público</option>
            <option value="false">Privado</option>
        </select> <br><br>
        <label for="ocupacao">Ocupação:</label>
        <input value="" type="text" name="ocupacao" id="ocupacao"> <br><br>
        <label for="local_trabalho">Local de Trabalho:</label>
        <input value="" type="text" name="local_trabalho" id="local_trabalho"> <br><br>
        <label for="morada">Morada:</label>
        <input value="" type="text" name="morada" id="morada"> <br><br>
        <label for="codigo_postal">Código Postal:</label>
        <input value="" type="text" name="codigo_postal" id="codigo_postal"> <br><br>
        <label for="nif">NIF:</label>
        <input value="" type="text" name="nif" id="nif"> <br><br>
        <label for="foto">Foto:</label>
        <input value="" type="url" name="foto" id="foto"> <br><br>
        <button type="submit">Register</button>
    </form>
</div>
</body>
<script>
    const forms = document.getElementById("formRegistration");

    forms.addEventListener("submit", event => {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value.trim();
        const passwordConfirmation = document.getElementById("passwordConfirmation").value.trim();

        const isPublic = document.getElementById("perfil").value;
        const occupation = document.getElementById("ocupacao").value.trim();
        const workspace = document.getElementById("local_trabalho").value.trim();
        const address = document.getElementById("morada").value.trim();
        const zip = document.getElementById("codigo_postal").value.trim();
        const nif = document.getElementById("nif").value.trim();
        const photo = document.getElementById("foto").value.trim();

        const data = {
            username,
            email,
            name,
            phone,
            password,
            passwordConfirmation,
            isPublic,
            occupation,
            workspace,
            address,
            zip,
            nif,
            photo
        };

        fetch('/rest/register/', {
            method: "POST",
            headers: {'Content-Type': 'application/json;'},
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
                throw new Error(`Registration failed with status ${response.status}`);
            } else {
                window.location.href = "../pages/login.html";
            }
        })
    });
</script>
</html>
